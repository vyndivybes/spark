name: Verify SPARK
on:
  push:
    branches: [main, feat/spark-experiences-and-cockpit]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-fund
      - run: npm test
      - run: python3 -m py_compile scripts/runtime_preflight.py backend/ada.py backend/web_agent.py
      - run: npm run build
