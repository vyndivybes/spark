name: Fireflies MCP qualification
on:
  push:
    branches: [integrations/fireflies-mcp-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fireflies-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -p test_spark_fireflies_mcp.py -v
      - run: python -m py_compile backend/spark_integrations.py backend/spark_connectivity.py scripts/connect-fireflies.py
