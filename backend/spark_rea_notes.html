<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; form-action 'none'; base-uri 'none'">
<title>SPARK Notes</title><style>body{margin:0;background:#edf5f5;color:#183b48;font:17px system-ui}header{padding:20px;border-bottom:1px solid #afc6cb}main{display:grid;grid-template-columns:270px 1fr;gap:24px;padding:24px}button,input,select,textarea{font:inherit;padding:10px;margin:4px;border:1px solid #91b2bc;border-radius:8px}button{background:#e0f2f3;color:#183b48;cursor:pointer}input,textarea{background:white;max-width:90%}textarea{display:block;width:90%;height:48vh}#notes button{display:block;width:94%;text-align:left}#title{width:90%}#preview{white-space:pre-wrap;padding:12px}small{display:block}#status{padding:8px}@media(max-width:650px){main{grid-template-columns:1fr}textarea{height:35vh}}</style>
</head><body><header><h1>SPARK Notes</h1><small>Original local recipe · notes stay in this app profile · no cloud sync</small></header><main><aside><label>Search <input id="search" aria-label="Search notes"></label><label>Folder <select id="folder" aria-label="Folder filter"></select></label><input id="folder-name" aria-label="New folder name" placeholder="New folder name"><button id="add-folder">New folder</button><button id="add-note">New note</button><div id="notes"></div></aside><section><input id="title" aria-label="Note title" placeholder="Note title"><div><select id="note-folder" aria-label="Note folder"></select><button id="pin">Pin</button><button id="bold">Bold</button><button id="italic">Italic</button><button id="delete">Delete note</button></div><textarea id="body" aria-label="Note content" placeholder="Write a note"></textarea><div id="preview" aria-label="Formatted preview"></div><p id="status" role="status"></p></section></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),key='spark-original-notes-v1';let state={folders:['Inbox'],notes:[],selected:null},filter='';
try{const s=JSON.parse(localStorage.getItem(key));if(s&&Array.isArray(s.folders)&&s.folders.length&&s.folders.every(x=>typeof x==='string')&&Array.isArray(s.notes)&&s.notes.every(n=>n&&typeof n.id==='string'&&typeof n.title==='string'&&typeof n.body==='string'&&typeof n.folder==='string'))state=s;}catch{}
function save(){try{localStorage.setItem(key,JSON.stringify(state));$('status').textContent='Saved locally';}catch{$('status').textContent='Storage unavailable — copy your text before closing';}}
function current(){return state.notes.find(n=>n.id===state.selected);}
function option(parent,value){const o=document.createElement('option');o.value=o.textContent=value;parent.append(o);}
function preview(text){const out=$('preview');out.replaceChildren();for(const part of text.split(/(\*\*[^*]+\*\*|_[^_]+_)/g)){let el;if(part.startsWith('**')&&part.endsWith('**')){el=document.createElement('strong');el.textContent=part.slice(2,-2);}else if(part.startsWith('_')&&part.endsWith('_')){el=document.createElement('em');el.textContent=part.slice(1,-1);}else el=document.createTextNode(part);out.append(el);}}
function render(){const n=current();for(const id of ['folder','note-folder']){$(id).replaceChildren();if(id==='folder')option($(id),'All folders');for(const f of state.folders)option($(id),f);}$('folder').value=filter||'All folders';$('notes').replaceChildren();const q=$('search').value.toLowerCase();for(const item of [...state.notes].sort((a,b)=>Number(b.pinned)-Number(a.pinned))){if((filter&&item.folder!==filter)||!(item.title+' '+item.body).toLowerCase().includes(q))continue;const b=document.createElement('button');b.dataset.note=item.id;b.textContent=(item.pinned?'★ ':'')+item.title;b.onclick=()=>{state.selected=item.id;save();render();};$('notes').append(b);}for(const id of ['title','body','note-folder','pin','bold','italic','delete'])$(id).disabled=!n;$('title').value=n?.title||'';$('body').value=n?.body||'';$('note-folder').value=n?.folder||state.folders[0];$('pin').textContent=n?.pinned?'Unpin':'Pin';preview(n?.body||'');}
$('add-folder').onclick=()=>{const f=$('folder-name').value;if(!f||!f.trim()||f.length>80)return;const name=f.trim();if(!state.folders.includes(name))state.folders.push(name);save();render();};
$('add-note').onclick=()=>{const id=crypto.randomUUID();state.notes.push({id,title:'Untitled',body:'',folder:filter||state.folders[0],pinned:false});state.selected=id;save();render();};
for(const id of ['title','body'])$(id).oninput=()=>{const n=current();if(!n)return;n[id]=$(id).value;save();if(id==='body')preview(n.body);};
$('note-folder').onchange=()=>{const n=current();if(n){n.folder=$('note-folder').value;save();render();}};
$('folder').onchange=()=>{filter=$('folder').value==='All folders'?'':$('folder').value;render();};$('search').oninput=render;
$('pin').onclick=()=>{const n=current();if(n){n.pinned=!n.pinned;save();render();}};
$('delete').onclick=()=>{if(!current()||!confirm('Delete this note?'))return;state.notes=state.notes.filter(n=>n.id!==state.selected);state.selected=state.notes[0]?.id||null;save();render();};
function format(mark){const n=current(),b=$('body');if(!n)return;const start=b.selectionStart,end=b.selectionEnd;n.body=b.value.slice(0,start)+mark+b.value.slice(start,end)+mark+b.value.slice(end);save();render();}
$('bold').onclick=()=>format('**');$('italic').onclick=()=>format('_');render();})();
</script></body></html>
