<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; form-action 'none'; base-uri 'none'"><title>SPARK Original App</title>
<style>body{margin:0;background:#eef6f7;color:#173b4a;font:17px system-ui}header,main{padding:24px}header{border-bottom:1px solid #bad0d6}h1{margin:0}nav{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}button,input,select{font:inherit;padding:10px;border:1px solid #9bbac3;border-radius:7px;margin:4px}button{background:#dceef1;color:#173b4a;cursor:pointer}label{display:grid;gap:3px;margin:8px}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}table{width:100%;border-collapse:collapse}td,th{padding:12px;border-bottom:1px solid #bdd1d6;text-align:left;overflow-wrap:anywhere}#table-wrap{overflow:auto;background:#fff;border-radius:10px}#limits{font-size:14px}#totals,#status{padding:8px}button:focus-visible,input:focus-visible{outline:3px solid #b18c41}</style></head>
<body><header><h1 id="app-title"></h1><p id="description"></p><small>Original local app. Data stays in this app profile. No network, cloud sync or external integrations.</small></header><main><nav id="entities"></nav><h2 id="entity-title"></h2><label>Search records<input id="search" aria-label="Search records"></label><button id="new-record">New record</button><form id="record-form"></form><p id="status" role="status"></p><div id="totals"></div><div id="table-wrap"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div><details><summary>Blueprint limitations</summary><ul id="limits"></ul></details></main>
<script id="blueprint" type="application/json">%%SPARK_BLUEPRINT%%</script>
<script>(()=>{'use strict';const config=JSON.parse(document.getElementById('blueprint').textContent),$=id=>document.getElementById(id),storageKey='spark-blueprint-records-v1';let entity=config.entities[0],editing=null,records=Object.create(null);
for(const e of config.entities)records[e.key]=[];
try{const saved=JSON.parse(localStorage.getItem(storageKey));if(saved&&typeof saved==='object')for(const e of config.entities)if(Array.isArray(saved[e.key]))records[e.key]=saved[e.key].slice(0,1000).filter(r=>r&&typeof r.id==='string');}catch{}
function persist(){try{localStorage.setItem(storageKey,JSON.stringify(records));$('status').textContent='Saved locally';return true;}catch{$('status').textContent='Storage unavailable. Keep this window open and copy your data.';return false;}}
function text(parent,tag,value){const e=document.createElement(tag);e.textContent=String(value??'');parent.append(e);return e;}
$('app-title').textContent=config.title;$('description').textContent=config.description;for(const l of config.limitations)text($('limits'),'li',l);
function form(row=null){editing=row?.id||null;$('record-form').replaceChildren();for(const f of entity.fields){const label=text($('record-form'),'label',f.label);let el;if(f.type==='select'){el=document.createElement('select');for(const option of f.options){const o=text(el,'option',option);o.value=option;}}else{el=document.createElement('input');el.type=f.type==='boolean'?'checkbox':f.type==='number'?'number':f.type==='date'?'date':'text';el.maxLength=2000;if(f.type==='number')el.step='any';}el.id='f-'+f.key;el.setAttribute('aria-label',f.label);el.required=f.required&&f.type!=='boolean';if(f.type==='boolean')el.checked=Boolean(row?.[f.key]);else el.value=row?.[f.key]??(f.options[0]||'');label.append(el);}const b=text($('record-form'),'button','Save record');b.id='save-record';b.type='submit';}
function render(){const q=$('search').value.toLowerCase();$('entity-title').textContent=entity.label;$('head').replaceChildren();const h=document.createElement('tr');for(const f of entity.fields)text(h,'th',f.label);text(h,'th','Actions');$('head').append(h);$('rows').replaceChildren();for(const row of records[entity.key]){if(!entity.fields.some(f=>String(row[f.key]??'').toLowerCase().includes(q)))continue;const tr=document.createElement('tr');tr.dataset.record=row.id;for(const f of entity.fields)text(tr,'td',f.type==='boolean'?(row[f.key]?'Yes':'No'):row[f.key]);const actions=document.createElement('td');const edit=text(actions,'button','Edit');edit.dataset.edit=row.id;edit.onclick=()=>form(row);const remove=text(actions,'button','Delete');remove.dataset.delete=row.id;remove.onclick=()=>{if(!confirm('Delete this record?'))return;records[entity.key]=records[entity.key].filter(r=>r.id!==row.id);if(editing===row.id)form();persist();render();};tr.append(actions);$('rows').append(tr);}const totals=[records[entity.key].length+' records'];for(const f of entity.fields.filter(f=>f.type==='number'))totals.push(f.label+': '+records[entity.key].reduce((sum,r)=>sum+(Number(r[f.key])||0),0));$('totals').textContent=totals.join(' | ');}
for(const e of config.entities){const b=text($('entities'),'button',e.label);b.dataset.entity=e.key;b.onclick=()=>{entity=e;$('search').value='';form();render();};}
$('new-record').onclick=()=>form();$('search').oninput=render;$('record-form').onsubmit=event=>{event.preventDefault();if(!editing&&records[entity.key].length>=1000){$('status').textContent='This entity has reached its 1000-record limit.';return;}const row={id:editing||crypto.randomUUID()};for(const f of entity.fields){const el=$('f-'+f.key);let v=f.type==='boolean'?el.checked:f.type==='number'?(el.value===''?null:Number(el.value)):el.value.trim();if(f.type==='number'&&v!==null&&!Number.isFinite(v)){ $('status').textContent='Enter a finite number.';return;}row[f.key]=v;}const i=records[entity.key].findIndex(r=>r.id===row.id);if(i<0)records[entity.key].push(row);else records[entity.key][i]=row;persist();form();render();};form();render();})();</script></body></html>
